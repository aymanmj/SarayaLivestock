version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: saraya_livestock_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be configured}
      POSTGRES_DB: ${DB_NAME:-saraya_livestock_db}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - livestock_net

  redis:
    image: redis:7-alpine
    container_name: saraya_livestock_redis
    restart: always
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    networks:
      - livestock_net

volumes:
  pgdata:
  redisdata:

networks:
  livestock_net:
    driver: bridge
