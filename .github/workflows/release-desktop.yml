name: Build & Release Windows Desktop Installer

on:
  push:
    tags:
      - 'v*'

jobs:
  quality-gate:
    uses: ./.github/workflows/ci.yml

  build-windows-installer:
    needs: quality-gate
    name: Build NSIS Installer & Portable Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json
            apps/desktop/package-lock.json

      - name: Install Web Dependencies
        working-directory: ./apps/web
        run: npm ci

      - name: Install Desktop Dependencies
        working-directory: ./apps/desktop
        run: npm ci

      - name: Build Web Application
        working-directory: ./apps/web
        run: npm run build

      - name: Build Desktop Executable & Installer
        working-directory: ./apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run prepare:web
          npm run build
          npx electron-builder --win --x64

      - name: Release Assets to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            apps/desktop/dist-electron/*.exe
            apps/desktop/dist-electron/*.blockmap
          draft: true
          prerelease: false
          generate_release_notes: true
